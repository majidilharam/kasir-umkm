<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Kasir</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-blue-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-4 rounded-xl shadow-xl w-96">
    <h1 class="text-center mb-4 font-bold text-blue-500 text-3xl">
        Login Kasir Umkm
    </h1>
    <div class="mb-4">
        <label class="block mb-2 font-semibold">Username</label>
        <input class="w-full bg-blue-500 text-white px-4 py-3 rounded-lg outline-none focus:ring-blue-500"" type="text" id="username" placeholder="Masukan username">
    </div>
    <div class="mb-4">
        <label class="block mb-2 font-semibold">Password</label>
        <input class="w-full bg-blue-500 text-white px-4 py-3 rounded-lg outline-none focus:ring-blue-500" type="password" id="password" placeholder="Masukan password" >
    </div>
    <button class=" cursor-pointer w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 mb-2" onclick="login()">Login</button>
    <p id="error" class="hidden text-center text-red-500 ">Username atau password salah</p>
</div>
    <script src="js/login.js"></script>
</body>
</html>
