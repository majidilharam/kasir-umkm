<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kasir UMKM</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <div class="flex">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-blue-700 min-h-screen text-white p-5">

      <h1 class="text-3xl font-bold mb-10">
        Kasir UMKM
      </h1>

      <nav class="space-y-3">

        <button
          onclick="loadPage('dashboard')"
          class="w-full text-left hover:bg-blue-600 p-3 rounded-lg"
        >
          Dashboard
        </button>

        <button
          onclick="loadPage('transaksi')"
          class="w-full text-left hover:bg-blue-600 p-3 rounded-lg"
        >
          Transaksi Penjualan
        </button>

        <button
          onclick="loadPage('produk')"
          class="w-full text-left hover:bg-blue-600 p-3 rounded-lg"
        >
          Data Produk
        </button>

        <button
          onclick="loadPage('riwayat')"
          class="w-full text-left hover:bg-blue-600 p-3 rounded-lg"
        >
          Riwayat Transaksi
        </button>

        <button
          onclick="loadPage('laporan')"
          class="w-full text-left hover:bg-blue-600 p-3 rounded-lg"
        >
          Laporan Penjualan
        </button>

      </nav>

    </aside>


    <main class="flex-1 p-8">

      <div id="content">
       
      </div>

    </main>

  </div>

  <script src="js/app.js"></script>
  <script src="js/produk.js"></script>
  <script src="js/transaksi.js"></script>

</body>
</html>
