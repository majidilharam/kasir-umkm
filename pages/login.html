<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script
            src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <title>Kasir-umkm</title>
    </head>
    <body class="bg-slate-900 flex items-center justify-center min-h-screen">
        <div class="w-full max-w-md bg-slate-800 p-8 rounded-2xl">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-white">Kasir UMKM</h1>
                <p class="text-slate-400 mt-4">Silahkan login untuk
                    melanjutkan</p>
            </div>
            <form class="space-y-5">
                <div>
                    <label class="text-white block mb-2">Username</label>
                    <input id="username"
                        class="w-full bg-slate-700 text-white px-4 py-3 rounded-lg outline-none focus:ring-blue-500"
                        type="text" placeholder="Masukan username anda">
                </div>
                <div>
                    <label class="text-white block mb-2">Password</label>
                    <input id="password"
                        class="w-full bg-slate-700 text-white px-4 py-3 rounded-lg outline-none focus:ring-blue-500"
                        type="password" placeholder="Masukan password anda">
                </div>
                <button id="loginBtn"
                    class="w-full bg-slate-700 text-white bg-blue-500 hover:bg-blue-600 transition duration-300 py-3 rounded-lg font-semibold cursor-pointer">Login</button>
                    <p id="errorMesagge" class="text-center text-red-500 text-sm mt-2"></p>
            </form>
        </div>
        <script src="../js/login.js"></script>
    </body>
</html>
