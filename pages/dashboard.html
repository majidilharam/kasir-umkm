<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasboard Kasir</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900">
    <div class="flex">
        <div class="w-64 h-screen bg-slate-800 p-5">
            <h1 class="text-2xl font-bold text-white mb-10">
                Kasir UMKM
            </h1>
            <ul class="space-y-4">
                <li><a class="block bg-blue-500 px-4 py-3 rounded-lg text-white" href="#">Dashboard</a></li>
                <li><a class="block hover:bg-slate-700 px-4 py-3 rounded-lg transition text-white" href="#">Produk</a></li>
                <li><a class="block hover:bg-slate-700 px-4 py-3 rounded-lg transition text-white" href="#">Transaksi</a></li>
            </ul>
            </div>
            <div class="flex-1 p-8">
                <h2 class="text-3xl font-bold text-white mb-8">
                    Dashboard
                </h2>
                <div class="grid grid-cols-3 gap-6">
                    <div class="bg-slate-700 p-6 rounded-2xl">
                        <h3 class="text-slate-400 mb-2">Total Produk</h3>
                        <p class="text-3xl font-bold">20</p>
                    </div>
                    <div class="bg-slate-700 p-6 rounded-2xl">
                        <h3 class="text-slate-400 mb-2">Total Transaksi</h3>
                        <p class="text-3xl font-bold">120</p>
                    </div>
                    <div class="bg-slate-700 p-6 rounded-2xl">
                        <h3 class="text-slate-400 mb-2">Pendapatan</h3>
                        <p class="text-3xl font-bold">2,000,000</p>
                    </div>

                </div>
            </div>
    </div>
    
</body>
</html>
